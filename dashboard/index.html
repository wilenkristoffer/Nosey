<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nosey Monitor</title>
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface2: #1c2128;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --blue: #58a6ff;
        --green: #3fb950;
        --yellow: #d29922;
        --purple: #bc8cff;
        --red: #f85149;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        padding: 28px;
        min-height: 100vh;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 28px;
      }

      h1 {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.12em;
        color: var(--muted);
      }

      .live-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }

      .live-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        animation: pulse 2s infinite;
      }

      .live-dot.error {
        background: var(--red);
        animation: none;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      .error-banner {
        background: rgba(248, 81, 73, 0.08);
        border: 1px solid rgba(248, 81, 73, 0.3);
        border-radius: 8px;
        padding: 12px 16px;
        color: var(--red);
        margin-bottom: 24px;
        display: none;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 28px;
      }

      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px;
      }

      .stat-label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        margin-bottom: 10px;
      }

      .stat-value {
        font-size: 30px;
        font-weight: 600;
        color: var(--blue);
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }

      .stat-sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 6px;
      }

      section {
        margin-bottom: 32px;
      }

      .section-title {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
        margin-bottom: 12px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 8px;
      }

      .pipeline-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 18px;
        margin-bottom: 8px;
        cursor: pointer;
      }

      .pipeline-card:hover {
        border-color: #3d444d;
      }

      .comment-text {
        display: none;
        margin-top: 14px;
        padding: 12px 14px;
        background: var(--surface2);
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.6;
        color: var(--text);
        border-left: 3px solid var(--blue);
        white-space: pre-wrap;
      }

      .pipeline-card.expanded .comment-text {
        display: block;
      }

      .pipeline-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 14px;
      }

      .pipeline-duration {
        font-size: 28px;
        font-weight: 700;
        color: var(--text);
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }

      .pipeline-time {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }

      .pipeline-right {
        text-align: right;
      }

      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        background: rgba(88, 166, 255, 0.12);
        color: var(--blue);
        border: 1px solid rgba(88, 166, 255, 0.25);
      }

      .pipeline-meta {
        display: flex;
        gap: 24px;
        margin-bottom: 14px;
      }

      .meta-item {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .meta-label {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .meta-value {
        font-size: 13px;
        color: var(--text);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      .bar-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 4px;
      }

      .bar-label {
        width: 100px;
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .bar-track {
        flex: 1;
        height: 6px;
        background: var(--surface2);
        border-radius: 3px;
        overflow: hidden;
      }

      .bar-fill {
        height: 100%;
        border-radius: 3px;
        background: var(--blue);
        transition: width 0.3s ease;
      }

      .bar-fill.purple {
        background: var(--purple);
      }

      .bar-val {
        width: 52px;
        text-align: right;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .tick-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
        gap: 8px;
      }

      .tick-cell {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 8px;
        text-align: center;
        cursor: default;
      }

      .tick-cell:hover {
        border-color: var(--muted);
      }

      .tick-dur {
        font-size: 14px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .tick-win {
        font-size: 10px;
        color: var(--muted);
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tick-cell.fast .tick-dur {
        color: var(--green);
      }

      .tick-cell.medium .tick-dur {
        color: var(--yellow);
      }

      .tick-cell.slow .tick-dur {
        color: var(--red);
      }

      .empty {
        color: var(--muted);
        font-size: 13px;
        padding: 20px 0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>NOSEY MONITOR</h1>
      <div class="live-badge">
        <div class="live-dot" id="live-dot"></div>
        <span id="live-label">connecting...</span>
      </div>
    </header>

    <div class="error-banner" id="error-banner"></div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Last Pipeline</div>
        <div class="stat-value" id="s-last">--</div>
        <div class="stat-sub" id="s-last-sub">no data yet</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg Pipeline</div>
        <div class="stat-value" id="s-avg">--</div>
        <div class="stat-sub" id="s-avg-sub">last 10 runs</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Comments</div>
        <div class="stat-value" id="s-count">--</div>
        <div class="stat-sub" id="s-count-sub">in Jaeger</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg Capture Tick</div>
        <div class="stat-value" id="s-tick">--</div>
        <div class="stat-sub" id="s-tick-sub">last 20 ticks</div>
      </div>
    </div>

    <section>
      <div class="section-title">Recent Pipeline Runs</div>
      <div id="pipelines"><div class="empty">Waiting for data -- switch a window to trigger a comment.</div></div>
    </section>

    <section>
      <div class="section-title">Capture Ticks (hover for details)</div>
      <div class="tick-grid" id="ticks"><div class="empty">No ticks yet.</div></div>
    </section>

    <script>
      const fmt = {
        ms: (v) => (v < 1000 ? `${Math.round(v)}ms` : `${(v / 1000).toFixed(2)}s`),
        time: (ts) =>
          new Date(ts).toLocaleTimeString([], {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
          }),
      }

      function parseTraces(json) {
        return (json.data || [])
          .map((trace) => {
            const span = trace.spans[0]
            if (!span) return null
            const tags = Object.fromEntries((span.tags || []).map((t) => [t.key, t.value]))
            return {
              traceID: trace.traceID,
              op: span.operationName,
              startMs: span.startTime / 1000,
              durationMs: span.duration / 1000,
              tags,
            }
          })
          .filter(Boolean)
          .sort((a, b) => b.startMs - a.startMs)
      }

      async function fetchOp(operation, limit = 30) {
        const p = new URLSearchParams({ service: 'nosey', operation, limit, lookback: '2h' })
        const res = await fetch(`/jaeger/api/traces?${p}`)
        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        return parseTraces(await res.json())
      }

      function renderPipelines(items) {
        if (!items.length)
          return '<div class="empty">No pipeline runs yet -- switch a window to trigger a comment.</div>'

        const maxDur = Math.max(...items.map((p) => p.durationMs), 1)

        return items
          .slice(0, 10)
          .map((p) => {
            const tokens = p.tags['token_count'] ?? '--'
            const mem = p.tags['process.memory_rss_mb']
              ? `${p.tags['process.memory_rss_mb']} MB RAM`
              : ''
            const model = p.tags['model.text'] || p.tags['model.vision'] || '--'
            const mode = p.tags['model.mode'] || '--'
            const chars = p.tags['comment.length'] ? `${p.tags['comment.length']} chars` : ''
            const pct = Math.max(4, Math.round((p.durationMs / maxDur) * 100))

            const commentText = p.tags['comment.text'] || ''
            return `
          <div class="pipeline-card" data-tid="${p.traceID}" onclick="this.classList.toggle('expanded')">
            <div class="pipeline-top">
              <div>
                <div class="pipeline-duration">${fmt.ms(p.durationMs)}</div>
                <div class="pipeline-time">${fmt.time(p.startMs)}</div>
              </div>
              <div class="pipeline-right">
                <span class="badge">${mode}</span>
              </div>
            </div>
            <div class="pipeline-meta">
              <div class="meta-item">
                <span class="meta-label">Tokens</span>
                <span class="meta-value">${tokens}</span>
              </div>
              <div class="meta-item">
                <span class="meta-label">Model</span>
                <span class="meta-value">${model}</span>
              </div>
              ${mem ? `<div class="meta-item"><span class="meta-label">Memory</span><span class="meta-value">${mem}</span></div>` : ''}
              ${chars ? `<div class="meta-item"><span class="meta-label">Output</span><span class="meta-value">${chars}</span></div>` : ''}
            </div>
            <div class="bar-row">
              <div class="bar-label">total pipeline</div>
              <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
              <div class="bar-val">${fmt.ms(p.durationMs)}</div>
            </div>
            ${commentText ? `<div class="comment-text">${commentText}</div>` : ''}
          </div>`
          })
          .join('')
      }

      function renderTicks(ticks) {
        if (!ticks.length) return '<div class="empty">No ticks recorded yet.</div>'

        return ticks
          .slice(0, 40)
          .map((t) => {
            const dur = t.durationMs
            const cls = dur < 150 ? 'fast' : dur < 350 ? 'medium' : 'slow'
            const win = t.tags['window.name'] || ''
            const changed = t.tags['window.changed']
            const captured = t.tags['image.captured']
            const short = win.length > 9 ? win.slice(0, 9) + '...' : win || '--'
            const tip = `${win || 'unknown'} | ${changed ? 'window changed' : 'same window'} | ${captured ? 'captured' : 'no capture'}`
            return `<div class="tick-cell ${cls}" title="${tip}">
              <div class="tick-dur">${fmt.ms(dur)}</div>
              <div class="tick-win">${short}</div>
            </div>`
          })
          .join('')
      }

      async function refresh() {
        const dot = document.getElementById('live-dot')
        const label = document.getElementById('live-label')
        const err = document.getElementById('error-banner')

        try {
          const [pipelines, ticks] = await Promise.all([
            fetchOp('nosey.ollama_pipeline', 20),
            fetchOp('nosey.capture_tick', 60),
          ])

          dot.className = 'live-dot'
          label.textContent = `updated ${fmt.time(Date.now())}`
          err.style.display = 'none'

          if (pipelines.length) {
            const last = pipelines[0]
            document.getElementById('s-last').textContent = fmt.ms(last.durationMs)
            document.getElementById('s-last-sub').textContent =
              `${last.tags['token_count'] ?? '--'} tokens`

            const recent = pipelines.slice(0, 10)
            const avg = recent.reduce((s, p) => s + p.durationMs, 0) / recent.length
            document.getElementById('s-avg').textContent = fmt.ms(avg)
            document.getElementById('s-avg-sub').textContent = `${recent.length} runs sampled`

            document.getElementById('s-count').textContent = pipelines.length
          }

          if (ticks.length) {
            const recent = ticks.slice(0, 20)
            const avg = recent.reduce((s, t) => s + t.durationMs, 0) / recent.length
            document.getElementById('s-tick').textContent = fmt.ms(avg)
            document.getElementById('s-tick-sub').textContent = `${ticks.length} ticks recorded`
          }

          const expanded = new Set(
            [...document.querySelectorAll('.pipeline-card.expanded')].map((el) => el.dataset.tid),
          )
          document.getElementById('pipelines').innerHTML = renderPipelines(pipelines)
          document.querySelectorAll('.pipeline-card').forEach((el) => {
            if (expanded.has(el.dataset.tid)) el.classList.add('expanded')
          })
          document.getElementById('ticks').innerHTML = renderTicks(ticks)
        } catch (e) {
          dot.className = 'live-dot error'
          label.textContent = 'error'
          err.style.display = 'block'
          err.textContent = `Cannot reach Jaeger -- is Docker running? (${e.message})`
        }
      }

      refresh()
      setInterval(refresh, 5000)
    </script>
  </body>
</html>
