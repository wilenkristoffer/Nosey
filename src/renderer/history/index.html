<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
    />
    <title>Nosey - Session History</title>
    <style>
      :root {
        --bg: #0d1117;
        --surface: #161b22;
        --surface2: #1c2128;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --blue: #58a6ff;
        --green: #3fb950;
        --yellow: #d29922;
        --red: #f85149;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      /* Sidebar */
      #sidebar {
        width: 250px;
        min-width: 250px;
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        background: var(--surface);
      }

      #sidebar-header {
        padding: 16px;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
      }

      #session-list {
        flex: 1;
        overflow-y: auto;
      }

      .session-item {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        transition: background 0.1s;
      }

      .session-item:hover {
        background: var(--surface2);
      }

      .session-item.active {
        background: var(--surface2);
        border-left: 3px solid var(--blue);
        padding-left: 13px;
      }

      .session-date {
        font-size: 12px;
        font-weight: 500;
        color: var(--text);
        margin-bottom: 4px;
      }

      .session-meta {
        font-size: 11px;
        color: var(--muted);
      }

      .session-active-badge {
        display: inline-block;
        font-size: 10px;
        padding: 1px 5px;
        border-radius: 3px;
        background: rgba(63, 185, 80, 0.15);
        color: var(--green);
        border: 1px solid rgba(63, 185, 80, 0.3);
        margin-left: 6px;
      }

      /* Main panel */
      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      #main-header {
        padding: 16px 20px;
        border-bottom: 1px solid var(--border);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--muted);
      }

      #comment-list {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .comment-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 16px;
      }

      .comment-card.funny {
        border-left: 3px solid var(--yellow);
        padding-left: 13px;
      }

      .comment-top {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .comment-time {
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      .comment-window {
        font-size: 11px;
        color: var(--blue);
        background: rgba(88, 166, 255, 0.1);
        padding: 1px 6px;
        border-radius: 3px;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .funny-badge {
        font-size: 14px;
        margin-left: auto;
      }

      .comment-text {
        font-size: 13px;
        line-height: 1.6;
        color: var(--text);
      }

      .question-text {
        margin-bottom: 6px;
        padding: 6px 10px;
        background: rgba(88, 166, 255, 0.08);
        border-left: 2px solid var(--blue);
        border-radius: 4px;
        font-size: 12px;
        color: var(--blue);
        line-height: 1.5;
      }

      .description-toggle {
        margin-top: 8px;
        font-size: 11px;
        color: var(--muted);
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
        user-select: none;
      }

      .description-toggle:hover {
        color: var(--text);
      }

      .description-text {
        margin-top: 6px;
        padding: 8px 10px;
        background: var(--surface2);
        border-radius: 4px;
        font-size: 12px;
        color: var(--muted);
        line-height: 1.5;
        display: none;
      }

      .description-text.visible {
        display: block;
      }

      .empty {
        color: var(--muted);
        text-align: center;
        padding: 40px 0;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="sidebar">
      <div id="sidebar-header">Sessions</div>
      <div id="session-list"><div class="empty" style="padding: 20px 16px">Loading...</div></div>
    </div>
    <div id="main">
      <div id="main-header" id="main-header">Select a session</div>
      <div id="comment-list"><div class="empty">Select a session to view comments.</div></div>
    </div>
    <script src="history.js"></script>
  </body>
</html>
